spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${JDBC_DATABASE_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:sahakarinet}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:${JDBC_DATABASE_USERNAME:${MYSQLUSER:root}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${JDBC_DATABASE_PASSWORD:${MYSQLPASSWORD:12345}}}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true